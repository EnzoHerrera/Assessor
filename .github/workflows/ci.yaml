name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar sintaxe do código
        run: python -m compileall -q app

      - name: Teste de fumaça (app sobe e /health responde)
        env:
          GEMINI_API_KEY: ci-dummy
          GROQ_API_KEY: ci-dummy
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          MONGODB_URI: mongodb://localhost:27017
          QDRANT_URL: http://localhost:6333
          QDRANT_API_KEY: ci-dummy
          TYPESAFE_API_KEY: ci-dummy
        run: |
          python - <<'EOF'
          # 1. Importa o cliente de teste do FastAPI e o app do projeto
          from fastapi.testclient import TestClient
          from app.main import app

          # 2. Cria um cliente que chama o app em memória, sem abrir porta
          client = TestClient(app)

          # 3. Faz uma requisição GET na rota de saúde
          resposta = client.get("/health")

          # 4. Falha a etapa (e a CI) se o status não for 200
          assert resposta.status_code == 200, resposta.text

          # 5. Mostra o conteúdo no log, para servir de evidência
          print("Status:", resposta.status_code)
          print("Corpo:", resposta.json())
          EOF